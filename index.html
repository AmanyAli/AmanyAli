<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trainee Registry</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { max-width: 640px; margin: 32px auto; padding: 0 16px; background: #f7f7f9; color: #222; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: #666; font-size: .9rem; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: .85rem; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
  input:focus, select:focus { outline: 2px solid #1a73e8; border-color: transparent; }
  button { padding: 10px 16px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  button.primary { background: #1a73e8; color: #fff; }
  button.primary:hover { background: #1557b0; }
  button.success { background: #1e8e3e; color: #fff; }
  button.success:hover { background: #166b2f; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .status { font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
  .status.ok  { color: #1e8e3e; }
  .status.err { color: #d93025; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .9rem; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  th { background: #fafafa; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: #555; }
  tr:hover td { background: #fafcff; }
  td.del { width: 40px; }
  .del-btn { background: none; border: none; color: #d93025; cursor: pointer; font-size: 1rem; padding: 2px 6px; }
  .empty { color: #888; font-style: italic; padding: 20px 0; text-align: center; }
  .count { font-size: .85rem; color: #555; margin-top: 8px; }
</style>
</head>
<body>

<h1>🥋 Trainee Registry</h1>
<p class="sub">Add each trainee, then export the list as a CSV file.</p>

<!-- ============ ADD TRAINEE ============ -->
<div class="card">
  <label for="traineeName">Trainee Name</label>
  <input id="traineeName" type="text" placeholder="e.g. Omar Hassan" autocomplete="off" />

  <label for="beltDegree">Belt Degree</label>
  <select id="beltDegree">
    <option value="">-- Select --</option>
    <option>White Belt</option>
    <option>Yellow Belt</option>
    <option>Orange Belt</option>
    <option>Green Belt</option>
    <option>Blue Belt</option>
    <option>Purple Belt</option>
    <option>Brown Belt</option>
    <option>Black Belt – 1st Dan</option>
    <option>Black Belt – 2nd Dan</option>
    <option>Black Belt – 3rd Dan</option>
    <option>Black Belt – 4th Dan</option>
    <option>Black Belt – 5th Dan</option>
  </select>

  <div class="row">
    <button class="primary" onclick="addTrainee()">➕ Add Trainee</button>
    <button class="success" id="exportBtn" onclick="exportCSV()" disabled>⬇️ Export CSV</button>
  </div>

  <div class="status" id="status"></div>
</div>

<!-- ============ LIST ============ -->
<div class="card">
  <div class="count" id="count">0 trainee(s)</div>
  <table id="table" style="display:none">
    <thead>
      <tr><th>#</th><th>Name</th><th>Belt</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="empty">No trainees yet.</div>
</div>

<script>
/* =========================================================
   STATE
   ========================================================= */
let trainees = [];

/* =========================================================
   ADD
   ========================================================= */
function addTrainee() {
  const name = document.getElementById('traineeName').value.trim();
  const belt = document.getElementById('beltDegree').value;

  if (!name) { setStatus('Please enter the trainee name.', 'err'); return; }
  if (!belt) { setStatus('Please select a belt degree.', 'err'); return; }

  trainees.push({ name, belt });
  render();

  document.getElementById('traineeName').value = '';
  document.getElementById('beltDegree').value  = '';
  document.getElementById('traineeName').focus();

  setStatus(`Added "${name}" (${belt})`, 'ok');
}

function removeTrainee(i) {
  const removed = trainees[i];
  if (!confirm(`Remove "${removed.name}"?`)) return;
  trainees.splice(i, 1);
  render();
  setStatus('Removed.', 'ok');
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const tbody = document.querySelector('#table tbody');
  const table = document.getElementById('table');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  tbody.innerHTML = '';
  count.textContent = `${trainees.length} trainee(s)`;

  const hasData = trainees.length > 0;
  table.style.display = hasData ? '' : 'none';
  empty.style.display = hasData ? 'none' : '';

  document.getElementById('exportBtn').disabled = !hasData;

  trainees.forEach((t, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${esc(t.name)}</td>
      <td>${esc(t.belt)}</td>
      <td class="del"><button class="del-btn" title="Remove" onclick="removeTrainee(${i})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function setStatus(msg, cls = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
  if (msg) setTimeout(() => {
    if (el.textContent === msg) { el.textContent = ''; el.className = 'status'; }
  }, 3000);
}

/* =========================================================
   CSV EXPORT
   ========================================================= */
function exportCSV() {
  if (trainees.length === 0) return;

  const headers = ['#', 'Trainee Name', 'Belt Degree'];
  const rows = trainees.map((t, i) => [i + 1, t.name, t.belt]);

  const csv = [headers, ...rows]
    .map(row => row.map(csvCell).join(','))
    .join('\r\n');

  // UTF-8 BOM so Excel opens Arabic/emojis correctly
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });

  const stamp = new Date().toISOString().slice(0, 10);
  const fileName = `trainees_${stamp}.csv`;

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);

  setStatus(`Downloaded ${fileName}`, 'ok');
}

function csvCell(value) {
  const s = String(value == null ? '' : value);
  if (/[",\r\n]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

/* =========================================================
   ENTER KEY = ADD
   ========================================================= */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'traineeName') {
    e.preventDefault();
    addTrainee();
  }
});
</script>
</body>
</html>
